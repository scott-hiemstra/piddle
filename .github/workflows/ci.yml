name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, test, build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 24.04 ships GTK 4.14, the minimum PIDdle supports.
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK 4 development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.arch }}-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Static launcher and terminal UI (musl)
        run: cargo build --release --locked --target ${{ matrix.arch }}-unknown-linux-musl -p piddle -p piddle-tui

      - name: Launcher and terminal UI link no GTK
        run: |
          for b in target/release/piddle target/release/piddle-tui; do
            if ldd "$b" | grep -Eq 'gtk|cairo|pango|glib'; then
              echo "::error::$b links GUI libraries"; ldd "$b"; exit 1
            fi
          done
