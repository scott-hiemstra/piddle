name: Release

# Push a tag like v0.3.0 to build the piddle and piddle-gui packages (.deb,
# .rpm, Arch) for x86_64 and aarch64 and publish them as a GitHub release.
# Run it manually to build the packages as workflow artifacts without
# publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Binaries, .deb and .rpm (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          # Ubuntu 24.04 ships GTK 4.14, the minimum PIDdle supports.
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev dpkg-dev fakeroot rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Test
        run: cargo test --workspace --locked

      - name: Build .deb
        run: packaging/build-deb.sh

      - name: Build .rpm
        run: PIDDLE_SKIP_BUILD=1 packaging/build-rpm.sh

      - uses: actions/upload-artifact@v7
        with:
          name: piddle-binaries-${{ matrix.arch }}
          path: |
            target/release/piddle-gui
            target/${{ matrix.arch }}-unknown-linux-musl/release/piddle
            target/${{ matrix.arch }}-unknown-linux-musl/release/piddle-tui
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: piddle-deb-rpm-${{ matrix.arch }}
          path: |
            target/debian/*.deb
            target/rpm/*.rpm
          if-no-files-found: error

  arch:
    name: Arch packages (${{ matrix.arch }})
    needs: build
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    # Ubuntu has no makepkg, so package the binaries inside Arch Linux.
    # Packaging only copies files, so the aarch64 package is made here too.
    container: archlinux:latest
    steps:
      - name: Install makepkg
        run: pacman -Syu --noconfirm --needed base-devel

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: piddle-binaries-${{ matrix.arch }}
          path: target

      - name: Build Arch packages
        # makepkg refuses to run as root.
        run: |
          chmod +x target/release/piddle-gui target/${{ matrix.arch }}-unknown-linux-musl/release/piddle*
          useradd -m builder
          chown -R builder .
          su builder -c 'PIDDLE_SKIP_BUILD=1 PIDDLE_ARCH=${{ matrix.arch }} packaging/build-arch.sh'

      - uses: actions/upload-artifact@v7
        with:
          name: piddle-arch-${{ matrix.arch }}
          path: target/arch/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: piddle-deb-rpm-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: piddle-arch-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist dist/debian dist/rpm
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PIDdle $GITHUB_REF_NAME" \
            --generate-notes \
            dist/debian/*.deb dist/rpm/*.rpm dist/*.pkg.tar.zst
