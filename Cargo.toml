[workspace]
resolver = "3"
members = ["crates/piddle", "crates/piddle-core", "crates/piddle-gui", "crates/piddle-tui"]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "MIT"
authors = ["Scott Hiemstra <scott@hiemstra.us>"]

# Shared crates from piddle-common, pinned to a release tag's commit (the
# same commit for each). scripts/bump-common.sh vX.Y.Z updates them, and
# scripts/use-local-common.sh builds against a sibling checkout instead.
[workspace.dependencies]
piddle-encode = { git = "https://github.com/scott-hiemstra/piddle-common", rev = "8db1e8531b782210776f2bb0849cb2a868d35bc9" } # v0.1.2
piddle-scene = { git = "https://github.com/scott-hiemstra/piddle-common", rev = "8db1e8531b782210776f2bb0849cb2a868d35bc9" } # v0.1.2
piddle-gtk = { git = "https://github.com/scott-hiemstra/piddle-common", rev = "8db1e8531b782210776f2bb0849cb2a868d35bc9" } # v0.1.2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
